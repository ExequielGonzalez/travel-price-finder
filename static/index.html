<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Price Finder</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Travel Price Finder</h1>
            <p class="subtitle">400+ airlines · 200+ connectors · Direct raw prices · No markup</p>
        </header>

        <form id="search-form">
            <div class="form-row">
                <div class="field autocomplete-field">
                    <label for="origin-input">Origin</label>
                    <div class="chips-container" id="origin-chips"></div>
                    <input id="origin-input" class="autocomplete-input" placeholder="Type country, city or IATA..." autocomplete="off">
                    <input type="hidden" id="origin" required>
                    <div class="autocomplete-dropdown hidden" id="origin-dropdown"></div>
                </div>
                <div class="field autocomplete-field">
                    <label for="destination-input">Destination</label>
                    <div class="chips-container" id="destination-chips"></div>
                    <input id="destination-input" class="autocomplete-input" placeholder="Type country, city or IATA..." autocomplete="off">
                    <input type="hidden" id="destination" required>
                    <div class="autocomplete-dropdown hidden" id="destination-dropdown"></div>
                </div>
                <div class="field">
                    <label for="date">Departure Date</label>
                    <input id="date" type="date" required>
                </div>
                <div class="field">
                    <label for="return_date">Return (optional)</label>
                    <input id="return_date" type="date">
                </div>
            </div>
            <div class="form-row form-row-small">
                <div class="field">
                    <label for="adults">Adults</label>
                    <input id="adults" type="number" min="1" max="9" value="1">
                </div>
                <div class="field">
                    <label for="cabin_class">Cabin</label>
                    <select id="cabin_class">
                        <option value="">Any</option>
                        <option value="M">Economy</option>
                        <option value="W">Premium</option>
                        <option value="C">Business</option>
                        <option value="F">First</option>
                    </select>
                </div>
                <div class="field">
                    <label for="max_stops">Max Stops</label>
                    <select id="max_stops">
                        <option value="0">Direct only</option>
                        <option value="1">1 stop</option>
                        <option value="2" selected>2 stops</option>
                    </select>
                </div>
                <div class="field">
                    <label for="mode">Speed</label>
                    <select id="mode">
                        <option value="fast">Fast (~25s)</option>
                        <option value="full">Full (~6min)</option>
                    </select>
                </div>
                <div class="field">
                    <button type="submit" id="search-btn">Search</button>
                </div>
            </div>
        </form>

        <div id="status" class="status"></div>

        <div id="toolbar" class="toolbar hidden">
            <div class="toolbar-left">
                <span id="filter-count" class="filter-count"></span>
            </div>
            <div class="toolbar-right">
                <label class="toggle" title="Only direct flights">
                    <input type="checkbox" id="filter-direct">
                    <span>Direct</span>
                </label>
                <label class="toggle" title="Only flights including checked baggage">
                    <input type="checkbox" id="filter-baggage">
                    <span>Baggage</span>
                </label>
                <label class="toggle" title="Only refundable fares">
                    <input type="checkbox" id="filter-refundable">
                    <span>Refundable</span>
                </label>
                <div class="sort-group">
                    <span class="sort-label">Sort:</span>
                    <select id="sort-select">
                        <option value="price">Cheapest</option>
                        <option value="duration">Fastest</option>
                        <option value="departure_early">Earliest</option>
                        <option value="departure_late">Latest</option>
                    </select>
                </div>
                <div class="download-group">
                    <button id="download-json" class="btn-download" title="Download JSON">JSON</button>
                    <button id="download-csv" class="btn-download" title="Download CSV">CSV</button>
                </div>
            </div>
        </div>

        <div id="results" class="results"></div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
